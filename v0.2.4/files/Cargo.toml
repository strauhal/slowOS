[package]
name = "files"
version = "0.2.3"
edition = "2021"
license = "MIT"
description = "A minimal file explorer for the Slow Computer"

[dependencies]
slowcore = { path = "../slowcore" }
trash = { path = "../trash" }
egui.workspace = true
eframe.workspace = true
chrono = "0.4"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "files"
path = "src/main.rs"
