[package]
name = "slowpaint"
version = "0.2.3"
edition = "2021"
license = "MIT"
description = "A minimal bitmap image editor for the Slow Computer"

[dependencies]
slowcore = { path = "../slowcore" }
egui.workspace = true
eframe.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif"] }
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
arboard = "3"

[[bin]]
name = "slowpaint"
path = "src/main.rs"
