[workspace]
resolver = "2"
members = [
    "slowcore",
    "slowdesktop",
    "slowwrite",
    "slowpaint",
    "books",
    "slownotes",
    "chess",
    "files",
    "music",
    "trash",
    "terminal",
    "slowview",
    "credits",
    "slowmidi",
    "slowbreath",
    "calculator",
    "slowdesign",
]

[workspace.package]
version = "0.2.4"
edition = "2021"
license = "MIT"
authors = ["Slow Computer Company"]

[profile.release]
# Optimize for binary size — every kilobyte costs RAM on the Pi Zero 2W.
# opt-level "s" is the size/speed sweet spot: meaningfully smaller than
# "3" but without the decode-heavy performance cliff of "z" (which
# disables loop unrolling and most inlining — Books cover extraction
# and image decoding were ~2-3x slower under "z").
#
# panic = "unwind" (the default) is kept. panic = "abort" turns any
# Rust panic into a hard process kill, which on macOS shows up as the
# generic "quit unexpectedly" dialog — and audio codec crates like
# symphonia can panic on malformed packets. With unwind the app
# displays an error message instead of dying. The unwinding tables
# add some disk size but almost no resident RAM (cold pages).
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
# eframe / egui with only the features we actually need:
#   - glow: the lightweight GL backend (vs. wgpu which pulls in
#     vulkan/metal runtime and is overkill for e-ink)
#   - persistence: eframe stores window state via this (used by chess)
#   - x11 + wayland: linux display backends
# We drop:
#   - accesskit: AccessKit loads a full accessibility tree into every
#     process and we have no screen reader integration
#   - default_fonts: egui embeds Hack + Ubuntu fonts as defaults; we
#     provide our own (IBM Plex / JetBrains Mono) so these are dead
#     weight
egui = { version = "0.27", default-features = false, features = ["bytemuck", "log"] }
eframe = { version = "0.27", default-features = false, features = ["glow", "persistence", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
