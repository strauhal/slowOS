# SlowOS SD card image layout
#
# Partition 1: boot   (FAT32) - kernel, device tree, firmware
# Partition 2: rootfs (ext4)  - the OS
# Partition 3: data   (FAT32) - user files (Books, Music, Pictures, Documents).
#                               FAT32 so the partition can be exposed over USB
#                               mass storage to Mac / Windows / phones without
#                               needing third-party ext4 drivers.

image boot.vfat {
    vfat {
        files = {
            "bcm2710-rpi-zero-2-w.dtb",
            "zImage",
            "rpi-firmware/bootcode.bin",
            "rpi-firmware/start.elf",
            "rpi-firmware/fixup.dat",
            "rpi-firmware/cmdline.txt",
            "rpi-firmware/config.txt"
        }
    }
    size = 64M
}

image rootfs.ext4 {
    ext4 {
        label = "rootfs"
    }
    size = 256M
}

image data.vfat {
    vfat {
        label = "SLOWBOOK"
    }
    size = 512M
}

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }

    partition data {
        partition-type = 0xC
        image = "data.vfat"
    }
}
