[package]
name = "clock"
version = "0.2.3"
edition = "2021"
license = "MIT"
description = "A dedicated clock application for the Slow Computer"

[dependencies]
slowcore = { path = "../slowcore" }
egui = "0.27"
eframe = "0.27"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "clock"
path = "src/main.rs"
