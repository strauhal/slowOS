[package]
name = "books"
version = "0.2.3"
edition = "2021"
license = "MIT"
description = "A minimal ebook reader for the Slow Computer"

[dependencies]
slowcore = { path = "../slowcore" }
egui.workspace = true
eframe.workspace = true
epub = "2.1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
resvg = "0.40"
open = "5"

[[bin]]
name = "books"
path = "src/main.rs"
