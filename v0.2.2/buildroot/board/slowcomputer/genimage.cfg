# SlowOS SD card image layout
# Pi 4 baseline: FAT32 LBA boot partition, 1 MiB aligned

image boot.vfat {
    vfat {
        extraargs = "-F 32"
        files = {
            "bcm2711-rpi-4-b.dtb",
            "Image",
            "rpi-firmware/start4.elf",
            "rpi-firmware/fixup4.dat",
            "rpi-firmware/cmdline.txt",
            "rpi-firmware/config.txt",
            "rpi-firmware/overlays"
        }
    }
    size = 64M
}

image data.ext4 {
    ext4 {
        label = "data"
    }
    size = 512M
}

image sdcard.img {
    hdimage {
        partition-table-type = "mbr"
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
        offset = 1M
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext2"
    }

    partition data {
        partition-type = 0x83
        image = "data.ext4"
    }
}
